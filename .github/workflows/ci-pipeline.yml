name: CI Pipeline

on:
  push:
    branches: [main, develop]
    # Docs-only changes don't need a pipeline run
    paths-ignore: ["**.md", "docs/**", ".gitignore"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the run that's still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: bookshelf
  REGISTRY_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/bookshelf

jobs:
  # ---------------- 1. Lint ----------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install flake8
        run: pip install flake8==7.4.1

      - name: Run flake8 (rules in .flake8 - max line 120, ignore E501/W503)
        run: flake8 . --count --show-source --statistics

  # ---------------- 2. Test (real MySQL) ----------------
  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: bookshelf
          MYSQL_USER: app
          MYSQL_PASSWORD: apppass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Service containers are reached via localhost in Actions, not by container name
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
      MYSQL_DATABASE: bookshelf
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Load schema and seed data into MySQL
        run: docker exec -i -e MYSQL_PWD=rootpass ${{ job.services.mysql.id }} mysql -uroot bookshelf < db/init.sql

      - name: Run pytest
        run: python -m pytest -v

  # ---------------- 3. Build, smoke test, push ----------------
  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Only real pushes to main publish an image; PRs and develop just build + test it
      SHOULD_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image was created
        run: docker images ${{ env.IMAGE_NAME }}

      - name: Smoke test the container
        run: |
          docker run -d --name smoke-test -p 5000:5000 ${{ env.IMAGE_NAME }}:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              echo; echo "Smoke test passed"; docker ps; exit 0
            fi
            echo "Waiting for app... ($i)"; sleep 2
          done
          echo "Smoke test FAILED"; docker logs smoke-test; exit 1

      - name: Log in to Docker Hub
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub (amd64 + arm64)
        if: env.SHOULD_PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------- 4. Security scan (reports, never blocks) ----------------
  security-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (from cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha

      # Pinned to a commit SHA, not a tag: in March 2026 attackers rewrote
      # most trivy-action tags to steal CI secrets. SHAs can't be moved.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Add report to job summary
        run: |
          echo "## Trivy scan: ${{ env.IMAGE_NAME }}:${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -n 150 trivy-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt
